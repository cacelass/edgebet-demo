name: Update ONNX Model

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy onnx onnxruntime lightgbm joblib

      - name: Generate demo model
        run: |
          python convert_model.py \
            --demo \
            --output models/demo.onnx \
            --n-features 10 \
            --league laliga \
            --market home

      - name: Verify ONNX model
        run: |
          python -c "
          import onnx
          model = onnx.load('models/demo.onnx')
          onnx.checker.check_model(model)
          print('ONNX model verified')
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(onnx): update demo model [automated]"
            git push
          fi
